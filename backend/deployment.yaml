apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: default
  labels:
    app: todo
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo
      component: backend
  template:
    metadata:
      labels:
        app: todo
        component: backend
    spec:
      containers:
        - name: backend
          image: k3d-cicd-registry:5050/todo-backend:v3.9.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 256Mi
              cpu: 500m
            limits:
              memory: 512Mi
              cpu: 1000m
