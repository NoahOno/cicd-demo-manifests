apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: default
  labels:
    app: app
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
      component: backend
  template:
    metadata:
      labels:
        app: app
        component: backend
    spec:
      containers:
        - name: backend
          image: k3d-cicd-registry:5050/app-backend:v3.9.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 256Mi
              cpu: 500m
            limits:
              memory: 512Mi
              cpu: 1000m
